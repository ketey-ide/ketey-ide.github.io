<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Where is my pet?</title>
    <style>
      :root {
        --bg: #ee9ed1;
        --ink: #090909;
        --white: #f5f2f0;
        --silver: #dce4e8;
        --green: #c8ec74;
        --yellow: #f0d96a;
        --pink: #f4a9cf;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        padding: 14px 18px 26px;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 7vw, 8rem);
        line-height: 0.9;
        letter-spacing: -0.075em;
        font-weight: 900;
      }

      .text {
        margin: 18px 0 0;
        max-width: 900px;
        font-size: clamp(1.05rem, 2vw, 2.15rem);
        line-height: 1.2;
        letter-spacing: -0.03em;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        font-weight: 700;
      }

      .pet-scene {
        position: relative;
        width: 420px;
        height: 370px;
        margin-top: 12px;
      }

      .headphones {
        position: absolute;
        left: 82px;
        top: 72px;
        width: 240px;
        height: 166px;
      }

      .headband {
        position: absolute;
        left: 16px;
        top: 18px;
        width: 210px;
        height: 112px;
        border: 12px solid rgba(255,255,255,0.9);
        border-bottom: 0;
        border-radius: 120px 120px 0 0;
        box-shadow: inset 0 0 0 3px rgba(0,0,0,0.04);
      }

      .earcup {
        position: absolute;
        top: 62px;
        width: 72px;
        height: 90px;
        border-radius: 48px;
        background: rgba(248,250,250,0.9);
        border: 6px solid rgba(175,176,176,0.95);
      }

      .earcup.left { left: 0; }
      .earcup.right { right: 0; }

      .earcup::before {
        content: "";
        position: absolute;
        inset: 8px 10px 12px;
        border-radius: 50%;
        background: rgba(170,172,175,0.7);
      }

      .pet {
        position: absolute;
        left: 90px;
        bottom: 0;
        width: 240px;
        height: 250px;
      }

      .head {
        position: absolute;
        left: 42px;
        top: 10px;
        width: 150px;
        height: 112px;
        background: var(--green);
        border: 6px solid var(--ink);
        border-radius: 24px;
      }

      .head::before,
      .head::after {
        content: "";
        position: absolute;
        top: -18px;
        width: 22px;
        height: 28px;
        border: 6px solid var(--ink);
        border-bottom: 0;
        background: var(--white);
        border-radius: 18px 18px 0 0;
      }

      .head::before { left: 18px; }
      .head::after { right: 18px; }

      .face {
        position: absolute;
        inset: 18px 16px 12px;
      }

      .letter {
        position: absolute;
        left: 42px;
        top: 2px;
        font-size: 35px;
        line-height: 1;
        font-weight: 900;
      }

      .eye {
        position: absolute;
        top: 28px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--ink);
      }

      .eye.left { left: 18px; }
      .eye.right { right: 18px; }

      .cheek {
        position: absolute;
        bottom: 10px;
        width: 16px;
        height: 10px;
        border-radius: 50%;
        background: rgba(236, 140, 180, 0.75);
      }

      .cheek.left { left: 10px; }
      .cheek.right { right: 10px; }

      .nose {
        position: absolute;
        left: 50%;
        bottom: 6px;
        transform: translateX(-50%);
        width: 12px;
        height: 10px;
        border-radius: 50%;
        background: rgba(238, 156, 188, 0.9);
      }

      .mouth {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        width: 28px;
        height: 14px;
        border-bottom: 4px solid var(--ink);
        border-radius: 0 0 16px 16px;
      }

      .arm {
        position: absolute;
        top: 124px;
        width: 18px;
        height: 72px;
        background: #f5f2ef;
        border: 6px solid var(--ink);
        border-radius: 18px;
      }

      .arm.left { left: 18px; transform: rotate(18deg); }
      .arm.right { right: 18px; transform: rotate(-18deg); }

      .body {
        position: absolute;
        left: 34px;
        top: 88px;
        width: 150px;
        height: 128px;
        background: #f5f2ef;
        border: 6px solid var(--ink);
        border-radius: 18px 18px 24px 24px;
      }

      .body::before,
      .body::after {
        content: "";
        position: absolute;
        bottom: -22px;
        width: 28px;
        height: 28px;
        background: var(--yellow);
        border: 6px solid var(--ink);
        border-radius: 12px 12px 14px 14px;
      }

      .body::before { left: 18px; }
      .body::after { right: 18px; }

      .feet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 26px;
      }

      .foot {
        width: 34px;
        height: 18px;
        background: var(--yellow);
        border: 6px solid var(--ink);
        border-radius: 16px;
      }

      @media (max-width: 600px) {
        .pet-scene {
          transform: scale(0.75);
          transform-origin: top left;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <h1>404: Where is my pet?</h1>

      <p class="text">
        You may entered something invalid, removed it or never existed.<br>
        Try playground.html, credits.html or you should try 2 htmls.<br>
        privacy.html or guidelines.html
      </p>

      <div class="pet-scene" aria-label="404 pet mascot">
        <div class="headphones" aria-hidden="true">
          <div class="headband"></div>
          <div class="earcup left"></div>
          <div class="earcup right"></div>
        </div>

        <div class="pet" aria-hidden="true">
          <div class="head">
            <div class="face">
              <div class="letter">K</div>
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="nose"></div>
              <div class="mouth"></div>
            </div>
          </div>

          <div class="arm left"></div>
          <div class="arm right"></div>

          <div class="body"></div>

          <div class="feet">
            <div class="foot"></div>
            <div class="foot"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
